record_keypad:
  name: Record Video Keypad
  description: Record received video and validate the clip before making it available in local media.
  target:
    entity:
      domain: camera
      integration: myq
  fields:
    duration:
      name: Video duration
      description: Seconds of received video. Connection interruptions may extend the elapsed time.
      default: 30
      selector:
        number:
          min: 5
          max: 300
          unit_of_measurement: seconds
